[tox]
requires =
    tox>=4
env_list = lint, py{310,311,312,313,314}

[testenv]
description = run unit tests
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linters
skip_install = true
deps =
    flake8
    flake8-commas
    isort
commands =
    flake8
    isort --check --diff .
